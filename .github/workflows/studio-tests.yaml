name: studio-tests

on:
  pull_request:
    paths: ["fem_solver/studio/**", ".github/workflows/studio-tests.yaml"]

jobs:
  pytest:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: fem_solver/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libxkbcommon0
      - name: Install Python packages
        run: pip install -r ../requirements.txt -r requirements.txt
      - name: Run tests
        run: pytest -m "not ui and not real_solver"
