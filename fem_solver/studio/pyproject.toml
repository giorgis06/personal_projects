[project]
name = "femstudio"
version = "0.0.0"
description = "Desktop front end for the fem_solver finite element solver"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "ui: creates a window; needs Qt, run offscreen",
    "real_solver: needs the compiled fem executable with its command-line interface",
]
